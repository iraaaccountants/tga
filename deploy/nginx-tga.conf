server {
    server_name www.tga-uae.com;
    # Redirect the old homepage URL, preserving query strings.
    if ($request_uri ~ ^/index\.html(?:\?|$)) { return 301 https://www.tga-uae.com/$is_args$args; }
    root /var/www/tga;
    index index.html;
    # Serve the static HTML file behind each clean URL.
    location / {
        rewrite ^/([A-Za-z0-9-]+)$ /$1.html break;
        try_files $uri $uri/ =404;
    }
    include /etc/nginx/snippets/tga-service-routes.conf;
    # Redirect legacy .html URLs for non-service pages.
    location ~ ^/(?!index\.html$)([A-Za-z0-9-]+)\.html$ { return 301 https://www.tga-uae.com/$1$is_args$args; }
    # Keep machine-readable companion files accessible but out of search results.
    location ~ \.md$ { default_type text/markdown; add_header X-Robots-Tag "noindex" always; try_files $uri =404; }
    location ~ \.json$ { add_header X-Robots-Tag "noindex" always; try_files $uri =404; }
    location = /llms.txt { add_header X-Robots-Tag "noindex" always; try_files $uri =404; }
    location = /llm.txt { add_header X-Robots-Tag "noindex" always; try_files $uri =404; }
    location ~ /\. { deny all; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.tga-uae.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.tga-uae.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.tga-uae.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.tga-uae.com;
    return 404; # managed by Certbot


}
